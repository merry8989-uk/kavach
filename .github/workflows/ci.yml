name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # A translation that drifts from the default silently shows English in the
      # middle of a Hindi screen. This fails the build instead.
      - name: Check translation key parity
        run: |
          python3 - <<'PYEOF'
          import re, sys, pathlib

          base = pathlib.Path("app/src/main/res")
          default = base / "values/strings.xml"

          def keys(path):
              return set(re.findall(r'<string name="(\w+)"', path.read_text()))

          if not default.exists():
              sys.exit("values/strings.xml is missing")

          expected_list = keys(default)
          duplicates = sorted({k for k in expected_list if expected_list.count(k) > 1})
          if duplicates:
              print(f"FAIL default: duplicated key(s): {duplicates}")
              sys.exit(1)

          expected = set(expected_list)
          failed = False

          for folder in sorted(base.glob("values-*")):
              path = folder / "strings.xml"
              if not path.exists():
                  print(f"FAIL {folder.name}: no strings.xml")
                  failed = True
                  continue
              found_list = keys(path)
              dupes = sorted({k for k in found_list if found_list.count(k) > 1})
              if dupes:
                  print(f"FAIL {folder.name}: duplicated key(s): {dupes}")
                  failed = True
              found = set(found_list)
              missing = expected - found
              extra = found - expected
              if missing:
                  print(f"FAIL {folder.name}: missing {len(missing)} key(s): {sorted(missing)[:5]}")
                  failed = True
              if extra:
                  print(f"FAIL {folder.name}: {len(extra)} key(s) not in the default: {sorted(extra)[:5]}")
                  failed = True
              if not missing and not extra:
                  print(f"OK   {folder.name}: {len(found)} keys match the default")

          print(f"{len(expected)} keys in the default language")
          sys.exit(1 if failed else 0)
          PYEOF

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon
