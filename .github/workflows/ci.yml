name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # A translation that drifts from the default silently shows English in the
      # middle of a Hindi screen. tools/check_translations.py fails the build
      # instead, and catches a duplicated key too — which is a resource-merge
      # error, not a warning.
      - name: Check translation key parity
        run: python3 tools/check_translations.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon
