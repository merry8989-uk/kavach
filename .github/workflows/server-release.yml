name: Server Release

# Builds the Kavach server image and publishes it to GitHub Container Registry,
# so deploying is `docker compose pull && up -d` on any VPS.
#
# No registry credentials are needed: GHCR accepts the workflow's own
# GITHUB_TOKEN, and the image is public unless you make the package private.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. 0.1.0). "latest" is always pushed too.'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'server-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kavach-server

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Verify migrations round-trip
        env:
          DATABASE_URL: sqlite:///./migration_check.db
          AUTO_CREATE_TABLES: 'false'
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64, so the same image runs on an ARM VPS.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Kavach server
            org.opencontainers.image.description=Caller identity, spam reputation and telemetry intake for the Kavach Android app
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

      - name: Summary
        run: |
          {
            echo "## Kavach server image"
            echo
            echo "Published \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}\`"
            echo
            echo "Run it:"
            echo
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
            echo
            echo "See docs/SERVER_DEPLOY.md for the full walkthrough."
          } >> "$GITHUB_STEP_SUMMARY"
