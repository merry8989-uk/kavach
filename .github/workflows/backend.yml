name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Known-vulnerability scan against the pinned requirements. This is the
      # check the spec asks for in Phases 13 and 15, and it is a gate rather than
      # a report: a dependency with a published CVE should stop the build, not
      # appear in a log nobody reads.
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Run tests
        run: pytest -q

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: sqlite:///./migration_check.db
          AUTO_CREATE_TABLES: 'false'
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
