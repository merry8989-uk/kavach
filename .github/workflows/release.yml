name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g. 0.2.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # --- Restore the private signing keystore from GitHub Secrets ---
      # The keystore itself is NEVER committed. See keystore/README.md.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/kavach-release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore/keystore.properties <<EOF
          storeFile=keystore/kavach-release.jks
          storeType=PKCS12
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Compute version
        id: ver
        run: |
          NAME="${{ github.event.inputs.versionName }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK + AAB
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} \
            --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/kavach-${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
             "out/kavach-${{ steps.ver.outputs.name }}.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kavach ${{ steps.ver.outputs.name }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          generate_release_notes: true
          files: |
            out/*.apk
            out/*.aab

      - name: Clean up signing material
        if: always()
        run: rm -rf keystore/kavach-release.jks keystore/keystore.properties
