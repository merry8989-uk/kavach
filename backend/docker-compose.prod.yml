# Production stack for the Kavach server: Postgres + the API.
#
#   cp .env.example .env      # fill it in, then: chmod 600 .env
#   docker compose -f docker-compose.prod.yml up -d
#
# Nothing here has a default password. If .env is missing, the API container
# exits rather than starting with something guessable.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - kavach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API needs to reach it.
    expose:
      - "5432"

  api:
    image: ${KAVACH_IMAGE:-ghcr.io/merry8989-uk/kavach-server:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      PHONE_PEPPER: ${PHONE_PEPPER:?set PHONE_PEPPER in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AUTO_CREATE_TABLES: "false"
      OTP_DEBUG_RETURN: "false"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Enforces telemetry retention on a timer. Runs as a tiny container so there is
  # no cron to install on the host.
  maintainer:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_TOKEN: ${API_TOKEN}
      API_BASE: http://api:8000
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while true; do
               sleep 900;
               curl -fsS -X POST -H \"Authorization: Bearer $$API_TOKEN\" \"$$API_BASE/v1/admin/telemetry/purge?keep_days=30\" || true;
             done"

volumes:
  kavach_pgdata:
